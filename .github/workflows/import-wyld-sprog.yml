name: Import Wyld Sprog catalog

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of products to fully enrich (0 = all)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and normalize public assortment
        run: python scripts/import_wyld_sprog.py --out /tmp/wyld-import --limit "${{ inputs.limit }}"

      - name: Upload import artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyld-catalog
          path: /tmp/wyld-import
          if-no-files-found: warn
          retention-days: 3
